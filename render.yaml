services:
  # 1. Backend FastAPI Service
  - type: web
    name: hiring-engine-backend
    env: docker
    dockerfilePath: docker/Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hiring-engine-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true



databases:
  # 3. PostgreSQL Database
  - name: hiring-engine-db
    databaseName: hiring_engine
    user: render_user
    plan: free
