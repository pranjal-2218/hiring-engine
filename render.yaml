services:
  # 1. Backend FastAPI Service
  - type: web
    name: hiring-engine-backend
    env: docker
    dockerfilePath: docker/Dockerfile.backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hiring-engine-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true

  # 2. Frontend Streamlit Service
  - type: web
    name: hiring-engine-frontend
    env: docker
    dockerfilePath: docker/Dockerfile.frontend
    plan: free
    envVars:
      - key: API_URL
        # If your backend gets a different name/URL on Render, update this value in the dashboard
        value: "https://hiring-engine-backend.onrender.com/api/v1"

databases:
  # 3. PostgreSQL Database
  - name: hiring-engine-db
    databaseName: hiring_engine
    user: render_user
    plan: free
